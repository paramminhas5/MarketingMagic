  target: 5
  period: week
- metric: social_posts
  target: 7
  period: week
- metric: pages
  target: 4
  period: month
- metric: flows
  target: 3
  period: month
- metric: leads_answered_10min_pct
  target: 100
  period: week
- metric: audits
  target: 1
  period: week
- metric: memos
