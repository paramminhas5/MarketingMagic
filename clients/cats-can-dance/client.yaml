slug: cats-can-dance
name: Cats Can Dance
url: https://catscandance.com
playbook: creator_media
description: 'Cats Can Dance (CCD) is a Bangalore culture company and catscandance.com is its platform for electronic music in India. Three products: Nights (What''s on: credible scene nights from across Indian ticketing sites, curated by rules; find your crew and say you''re going; CCD''s own Episodes with free RSVP or tickets; promoter nights that any approved promoter can run under the CCD site, free for now), Artists (Indian and South Asian artist pages with bio, press kit, mixes, tour dates and booking; claimable; On tour listings) and School (gamified Ableton Live learning). Also Door and Gate, a door app for check-in, walk-ins and outside tickets (CSV from District, BookMyShow, Skillbox, Insider) that CCD offers to promoters, plus a shop and Cats Can Care. Episodes are capped, mostly free, RSVP-only nights in house, disco, UK garage, breaks, drum & bass, jungle and dub techno. Founder Param Minhas has a ~150k-follower social page.'
geo:
- Bengaluru
- Mumbai
- Delhi
- Goa
- India
icp: 'Fans: 21-35 year-olds in Indian cities into house, disco, UK garage, breaks, drum & bass, jungle and dub techno (not commercial EDM), who care about music, design and streetwear, often pet owners. Artists: Indian and touring DJs/producers who want gigs, a profile and audience growth. Promoters and venues: people who want the right crowd and better F&B spend. Brands: sponsors (pet, lifestyle) for CCD x Social.

  '
offers:
- name: Episodes (RSVP / tickets)
  price: Mostly free, capped
  description: CCD's own curated nights, 200-400 people, resident and guest selectors.
- name: What's on + crews
  description: Every credible underground night in one list; say you're going, find or join a crew, reminders by web push.
- name: Promoter nights
  price: Free now; later 10% of paid ticket sales
  description: Approved promoters run nights in their own look on catscandance.com, with tickets or a free list and the Door app.
- name: Door / Gate
  price: Free now (Pro for everyone); paid plans later
  description: Door app for check-in, walk-ins, live count and outside tickets imported from other platforms.
- name: Artist pages + booking
  description: Claimable artist pages with press kit, mixes, tour dates and booking requests.
- name: CCD School
  description: Gamified Ableton Live learning.
- name: Shop and drops
  description: Limited apparel and pet streetwear; no restocks.
competitors: []
